name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android wrapper
        run: |
          echo '{"name":"egypt-explorer","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.egypt.explorer","appName":"Egypt Explorer","webDir":".","plugins":{}}' > capacitor.config.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Egypt-Explorer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
